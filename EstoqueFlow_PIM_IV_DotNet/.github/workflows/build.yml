name: build
on:
  push:
  pull_request:
jobs:
  web-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: dotnet restore src/EstoqueFlow.Web/EstoqueFlow.Web.csproj
      - run: dotnet build src/EstoqueFlow.Web/EstoqueFlow.Web.csproj --no-restore
